[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "laptop-link-mcp"
version = "0.1.0"
description = "MCP filesystem and command tools for an authenticated macOS BLE server"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "jsonschema>=4.23,<5"]

[project.scripts]
laptop-link-mcp = "laptop_link_mcp.main:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["src/laptop_link_mcp"]
